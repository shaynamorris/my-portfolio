<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayna Morris | Portfolio</title>

<style>

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background-color: #e6dede;
  color: #333;
}

section {
  padding: 80px 10%;
}

h2 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 50px;
  color: #555;
}

/* ---------- GRAPHIC DESIGN ---------- */

.design-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
}

.design-card {
  background: #f3f3f3;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.design-card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  display: block;
}

/* ---------- PHOTOGRAPHY ---------- */

.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

.photo-card {
  background: #f3f3f3;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.photo-card img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  display: block;
}

/* ---------- ANIMATION ---------- */

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 30px;
}

video {
  width: 100%;
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

/* ---------- CONTACT ---------- */

.contact {
  text-align: center;
  padding-bottom: 80px;
}

.contact p {
  font-size: 18px;
}

</style>
</head>

<body>

<!-- GRAPHIC DESIGN -->
<section>
  <h2>Graphic Design</h2>

  <div class="design-grid">
    <div class="design-card">
      <img src="/my-portfolio/design1.jpg" alt="Design 1">
    </div>

    <div class="design-card">
      <img src="/my-portfolio/design2.jpg" alt="Design 2">
    </div>

    <div class="design-card">
      <img src="/my-portfolio/design3.png" alt="Design 3">
    </div>

    <div class="design-card">
      <img src="/my-portfolio/design4.jpg" alt="Design 4">
    </div>
  </div>
</section>

<!-- PHOTOGRAPHY -->
<section>
  <h2>Photography</h2>

  <div class="photo-grid">

    <div class="photo-card">
      <img src="/my-portfolio/monstera.jpg" alt="Monstera">
    </div>

    <div class="photo-card">
      <img src="/my-portfolio/peace-lily.jpg" alt="Peace Lily">
    </div>

    <div class="photo-card">
      <img src="/my-portfolio/snake-plant.jpg" alt="Snake Plant">
    </div>

    <div class="photo-card">
      <img src="/my-portfolio/parlor-palm.jpg" alt="Parlor Palm">
    </div>

  </div>
</section>

<!-- ANIMATION -->
<section>
  <h2>Animation</h2>

  <div class="video-grid">

    <video controls>
      <source src="/my-portfolio/motion-graphic.mp4" type="video/mp4">
    </video>

    <video controls>
      <source src="/my-portfolio/vyond-animation.mp4" type="video/mp4">
    </video>

  </div>
</section>

<!-- CONTACT -->
<section class="contact">
  <h2>Contact</h2>
  <p>Email: shaynamorris123@gmail.com</p>
</section>

</body>
</html>
