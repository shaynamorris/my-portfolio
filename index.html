<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayna Morris | Portfolio</title>

<style>

/* ---------- GENERAL ---------- */

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background-color: #e6dede;
  color: #333;
}

section {
  padding: 80px 10%;
}

h2 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 50px;
  color: #555;
  letter-spacing: 1px;
}

/* ---------- GRAPHIC DESIGN ---------- */

.design-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 30px;
}

.design-card {
  background: #ffffff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  padding: 15px;
}

.design-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 18px 40px rgba(0,0,0,0.12);
}

.design-card img {
  width: 100%;
  height: auto;                 /* keeps image proportional */
  aspect-ratio: 16 / 9;         /* keeps layout consistent */
  object-fit: contain;          /* prevents cropping */
  background-color: #ffffff;    /* clean background if spacing appears */
  display: block;
  border-radius: 12px;
}

/* ---------- PHOTOGRAPHY ---------- */

.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

.photo-card {
  background: #ffffff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  transition: transform 0.3s ease;
}

.photo-card:hover {
  transform: translateY(-6px);
}

.photo-card img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  display: block;
}

/* ---------- ANIMATION ---------- */

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 30px;
}

video {
  width: 100%;
  border-radius: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

/* ---------- CONTACT ---------- */

.contact {
  text-align: center;
  padding-bottom: 80px;
}

.contact p {
  font-size: 18px;
}

</style>
</head>

<body>

<!-- GRAPHIC DESIGN -->
<section>
  <h2>Graphic Design</h2>

  <div class="design-grid">

    <div class="design-card">
      <img src="design1.jpg" alt="Stylish Clothes Advertisement Design">
    </div>

    <div class="design-card">
      <img src="design2.jpg" alt="Nail Polish Advertisement Design">
    </div>

    <div class="design-card">
      <img src="design3.png" alt="Nails Promotional Design">
    </div>

    <div class="design-card">
      <img src="design4.jpg" alt="Cosy Furniture Sale Design">
    </div>

  </div>
</section>

<!-- PHOTOGRAPHY -->
<section>
  <h2>Photography</h2>

  <div class="photo-grid">

    <div class="photo-card">
      <img src="monstera.jpg" alt="Monstera Plant">
    </div>

    <div class="photo-card">
      <img src="peace-lily.jpg" alt="Peace Lily Plant">
    </div>

    <div class="photo-card">
      <img src="snake-plant.jpg" alt="Snake Plant">
    </div>

    <div class="photo-card">
      <img src="parlor-palm.jpg" alt="Parlor Palm Plant">
    </div>

  </div>
</section>

<!-- ANIMATION -->
<section>
  <h2>Animation</h2>

  <div class="video-grid">

    <video controls>
      <source src="motion-graphic.mp4" type="video/mp4">
    </video>

    <video controls>
      <source src="vyond-animation.mp4" type="video/mp4">
    </video>

  </div>
</section>

<!-- CONTACT -->
<section class="contact">
  <h2>Contact</h2>
  <p>Email: shaynamorris123@gmail.com</p>
</section>

</body>
</html>
