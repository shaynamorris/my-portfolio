<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayna Morris | Instructional Designer</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: #fdf6f9;
  color: #4a4a4a;
  line-height: 1.6;
}

/* HERO */
.hero {
  min-height: 80vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #fdf6f9, #f3e8ee);
  text-align: center;
  padding: 40px 20px;
}

.hero img {
  width: 170px;
  border-radius: 50%;
  margin-bottom: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.hero h1 {
  font-size: 44px;
  color: #b5838d;
  margin-bottom: 15px;
}

.hero p {
  font-size: 18px;
  max-width: 600px;
}

.hero-button {
  margin-top: 25px;
  padding: 12px 28px;
  background: #b5838d;
  color: white;
  border-radius: 30px;
  text-decoration: none;
  font-weight: 600;
  transition: 0.3s ease;
}

.hero-button:hover {
  background: #6d6875;
}

/* SECTIONS */
.section {
  max-width: 1100px;
  margin: auto;
  padding: 90px 30px;
}

.section:nth-child(even) {
  background: #ffffff;
}

.section h2 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 60px;
  color: #6d6875;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.05);
  transition: transform 0.3s ease;
}

.card:hover {
  transform: translateY(-6px);
}

.card img,
video {
  width: 100%;
  height: 280px;
  object-fit: cover;
  border-radius: 14px;
}

/* CONTACT */
.contact {
  text-align: center;
  padding: 70px 20px;
  background: #ffffff;
}

.contact a {
  color: #b5838d;
  font-weight: bold;
  text-decoration: none;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  font-size: 14px;
  color: #777;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <img src="me.jpg" alt="Shayna Morris">
  <h1>Hello, I’m Shayna 🌸</h1>
  <p>
    Instructional Designer and E-Learning Developer creating structured,
    visually engaging digital learning experiences.
  </p>
  <a href="#work" class="hero-button">View My Work</a>
</div>

<!-- GRAPHIC DESIGN -->
<div class="section" id="work">
  <h2>Graphic Design</h2>
  <div class="grid">
    <div class="card"><img src="design1.jpg" alt=""></div>
    <div class="card"><img src="design2.jpg" alt=""></div>
    <div class="card"><img src="design3.png" alt=""></div>
    <div class="card"><img src="design4.jpg" alt=""></div>
  </div>
</div>

<!-- PHOTOGRAPHY -->
<div class="section">
  <h2>Photography</h2>
  <div class="grid">
    <div class="card"><img src="monstera.jpg" alt="Monstera"></div>
    <div class="card"><img src="peace-lily.jpg" alt="Peace Lily"></div>
    <div class="card"><img src="snake-plant.jpg" alt="Snake Plant"></div>
    <div class="card"><img src="parlor-palm.jpg" alt="Parlor Palm"></div>
  </div>
</div>

<!-- ANIMATION -->
<div class="section">
  <h2>Animation</h2>
  <div class="grid">
    <div class="card">
      <video controls>
        <source src="vyond-animation.mp4" type="video/mp4">
      </video>
    </div>
    <div class="card">
      <video controls>
        <source src="motion-graphic.mp4" type="video/mp4">
      </video>
    </div>
  </div>
</div>

<!-- CONTACT -->
<div class="contact">
  <h2>Contact</h2>
  <p>Email: <a href="mailto:shaynamorris123@gmail.com">shaynamorris123@gmail.com</a></p>
</div>

<footer>
© 2026 Shayna Morris | Instructional Designer
</footer>

</body>
</html>
